<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Engine Failure Prediction</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:460px;
    padding:35px;
    border-radius:20px;
    background:rgba(20,20,20,0.65);
    backdrop-filter:blur(12px);
    box-shadow:0px 10px 30px rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.2);
}

h2{
    color:#FFD700;
    text-align:center;
    margin-bottom:25px;
    font-size:30px;
    font-weight:700;
    text-shadow:2px 2px 5px black;
}

label{
    color:white;
    font-size:16px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:18px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:15px;
    transition:.3s;
}

input::placeholder{
    color:#dddddd;
}

input:focus{
    outline:none;
    background:rgba(255,255,255,.25);
    box-shadow:0px 0px 10px #00BFFF;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#ff512f,#dd2476);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.4s;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0px 0px 20px rgba(255,81,47,.6);
}

.result{
    margin-top:25px;
    padding:15px;
    background:linear-gradient(90deg,#00b09b,#96c93d);
    border-radius:10px;
    text-align:center;
    font-size:22px;
    color:white;
    font-weight:bold;
    animation:fadeIn .7s;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#dddddd;
    font-size:14px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0px);
    }
}

</style>

</head>

<body>

<div class="container">

<h2>🚗 Vehicle Engine Failure Prediction</h2>

<form action="/predict" method="POST" onsubmit="return validateForm()">

<label>Engine Temperature (°C)</label>
<input type="number" step="0.01" id="engine_temp_c" name="engine_temp_c" placeholder="Example: 95.40" required>

<label>Coolant Temperature (°C)</label>
<input type="number" step="0.01" id="coolant_temp_c" name="coolant_temp_c" placeholder="Example: 82.30" required>

<label>Engine Load (%)</label>
<input type="number" step="0.01" id="engine_load_percent" name="engine_load_percent" placeholder="Example: 64.20" required>

<label>Vehicle Speed (km/h)</label>
<input type="number" step="0.01" id="vehicle_speed_kph" name="vehicle_speed_kph" placeholder="Example: 78.50" required>

<button type="submit">
Predict Engine Status
</button>

</form>

{% if prediction %}

<div class="result">
Prediction : {{ prediction }}
</div>

{% endif %}

<div class="footer">
🚘 AI Powered Vehicle Telemetry Monitoring System
</div>

</div>

<script>

function validateForm(){

let temp=parseFloat(document.getElementById("engine_temp_c").value);
let coolant=parseFloat(document.getElementById("coolant_temp_c").value);
let load=parseFloat(document.getElementById("engine_load_percent").value);
let speed=parseFloat(document.getElementById("vehicle_speed_kph").value);

if(temp<0 || coolant<0 || load<0 || speed<0){

alert("Negative values are not allowed.");

return false;

}

if(load>100){

alert("Engine Load should be between 0 and 100%.");

return false;

}

return true;

}

</script>

</body>
</html>
